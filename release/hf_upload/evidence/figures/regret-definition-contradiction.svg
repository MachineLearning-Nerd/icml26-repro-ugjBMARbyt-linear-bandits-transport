<text x="284" y="129.944" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">113,728,636</text>
<text x="284" y="509" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">printed lower</text>
