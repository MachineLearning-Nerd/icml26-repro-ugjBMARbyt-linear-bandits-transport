<text x="600" y="655" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#b42318" text-anchor="middle">Violation margins: 113,330,097 and 99,417,253</text>
<text x="600" y="676" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">The contradiction comes from subtracting one comparator after summing T objectives.</text>
