<text x="436" y="509" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">RHS upper</text>
<text x="360" y="544" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Theorem 5.1</text>
