<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Regret definition contradiction</title>
<desc id="desc">Generated directly from the public verifier JSON. Red reports the failed paper contract; green reports a separately scoped replacement claim.</desc>
<rect width="1120" height="720" fill="white"/>
<text x="60" y="54" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033" text-anchor="start">Printed regret exceeds a complete theorem-RHS upper bound</text>
<text x="60" y="84" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Nonconstant 2×2 instance, zero noise, T = 100,000,000; vertical axis is logarithmic.</text>
<line x1="118" y1="480" x2="1050" y2="480" stroke="#d0d5dd" stroke-width="1"/>
<text x="102" y="485" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="end">10^5</text>
