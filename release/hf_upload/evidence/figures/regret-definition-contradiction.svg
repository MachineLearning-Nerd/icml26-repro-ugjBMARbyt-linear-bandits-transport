<text x="102" y="374.375" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="end">10^6</text>
<line x1="118" y1="258.75" x2="1050" y2="258.75" stroke="#d0d5dd" stroke-width="1"/>
<text x="102" y="263.75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="end">10^7</text>
<line x1="118" y1="148.125" x2="1050" y2="148.125" stroke="#d0d5dd" stroke-width="1"/>
<text x="102" y="153.125" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="end">10^8</text>
